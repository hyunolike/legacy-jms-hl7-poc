# ============================================================================
#  HL7 ADT 브리지 설정
#
#  값은 ${ENV_VAR:기본값} 형태로 적는다. 이렇게 하면 이 파일은 "기본값 목록"이
#  되고 실제 값은 환경변수로 주입된다. 파일에 비밀값이 박히지 않는다.
#
#  ⚠ DB 비밀번호에는 기본값이 있지만 PHI 암호화 키에는 없다. 의도된 차이다.
#    - DB: 로컬 docker-compose 전용 계정이라 기본값이 있어야 바로 돌려볼 수 있다.
#    - 키: 기본값을 두면 "설정 안 해도 돌아가네" 하고 그대로 운영에 나간다.
#          비어 있으면 KeyProvider 가 기동 시점에 즉시 실패한다(fail-fast).
# ============================================================================

# ── JMS ─────────────────────────────────────────────────────────────────────
jms.broker.url                   = ${HL7POC_BROKER_URL:tcp://localhost:61616}
jms.broker.user                  = ${HL7POC_BROKER_USER:}
jms.broker.password              = ${HL7POC_BROKER_PASS:}

jms.queue.adtRequest             = Q.HL7.ADT.REQ
jms.queue.adtAck                 = Q.HL7.ADT.ACK
jms.queue.adtPark                = Q.HL7.ADT.PARK
jms.queue.adtDlq                 = DLQ.Q.HL7.ADT.REQ

# 동시성: 평상시 3개, 밀리면 10개까지 늘린다.
jms.consumers.min                = 3
jms.consumers.max                = 10
# 메시지 그룹을 쓰므로 prefetch 를 낮게 둔다. 크면 한 컨슈머가 그룹을 잔뜩
# 쥐고 있어 나머지 컨슈머가 놀고 부하가 쏠린다.
jms.prefetch                     = 1
jms.receiveTimeoutMs             = 5000
# ⚠ CACHE_NONE 으로 내리면 재전송 지연(2s/4s/8s)이 통째로 무시된다.
#   컨슈머를 매번 버리는데 클라이언트측 지연은 "그 컨슈머를 잠시 쉬게" 하는
#   방식이라, 쉴 컨슈머가 남아 있지 않기 때문이다. 실측은 docs/03 참고.
jms.cacheLevelName               = ${HL7POC_JMS_CACHE_LEVEL:CACHE_CONSUMER}
# 컨슈머를 줄일 수 있게 태스크를 주기적으로 끝낸다. -1 이면 절대 안 줄어든다.
jms.maxMessagesPerTask           = 10

# 재시도(클라이언트측). 기본 2s → 4s → 8s 후 DLQ.
# 재빌드 없이 조정할 수 있어야 한다. 상대 시스템의 복구 시간은 연동마다 다르고,
# 장애 중에 "재시도 간격만 늘리고 싶은" 상황이 실제로 생긴다.
jms.redelivery.max               = ${HL7POC_REDELIVERY_MAX:3}
jms.redelivery.initialDelayMs    = ${HL7POC_REDELIVERY_INITIAL_MS:2000}
jms.redelivery.delayMs           = ${HL7POC_REDELIVERY_DELAY_MS:2000}
jms.redelivery.backOffMultiplier = ${HL7POC_REDELIVERY_MULTIPLIER:2}
jms.redelivery.maxDelayMs        = ${HL7POC_REDELIVERY_MAX_DELAY_MS:30000}

# ── DB ──────────────────────────────────────────────────────────────────────
db.driver                        = org.postgresql.Driver
db.url                           = ${HL7POC_DB_URL:jdbc:postgresql://localhost:5432/hl7poc}
db.user                          = ${POSTGRES_USER:hl7poc}
db.password                      = ${POSTGRES_PASSWORD:hl7poc-local-only}

# 풀 크기는 jms.consumers.max 보다 커야 한다. 같거나 작으면 컨슈머가 전부
# 커넥션을 기다리며 굶는다. 여기서는 10 + 여유 5 = 15.
db.pool.initialSize              = 3
db.pool.minIdle                  = 3
db.pool.maxIdle                  = 5
db.pool.maxTotal                 = 15
db.pool.maxWaitMillis            = 5000
db.pool.validationQuery          = SELECT 1

# ── secure (PHI 암복호화) ───────────────────────────────────────────────────
# 기본값 없음. 비어 있으면 기동 실패시킨다.
secure.phi.keyId                 = ${HL7POC_PHI_KEY_ID:k1}
secure.phi.key                   = ${HL7POC_PHI_KEY:}
secure.blindIndex.key            = ${HL7POC_BLIND_INDEX_KEY:}

# ── ws (병원 B SOAP) ────────────────────────────────────────────────────────
ws.hospitalB.endpoint            = ${HL7POC_HOSPITAL_B_ENDPOINT:http://localhost:9090/hospital-b/admission}
# 타임아웃을 반드시 건다. SOAP 호출이 DB 트랜잭션 안에 있어서, 무한 대기는
# 커넥션 풀을 통째로 말려 죽인다.
ws.hospitalB.connectTimeoutMs    = 3000
ws.hospitalB.readTimeoutMs       = 5000

# ── HL7 ─────────────────────────────────────────────────────────────────────
hl7.validation.enabled           = true
hl7.ack.sendingApp               = HL7POC_BRIDGE
hl7.ack.sendingFacility          = HOSP_BRIDGE
