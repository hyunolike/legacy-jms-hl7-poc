# HL7 ADT 브리지 PoC 로컬 인프라
#   docker compose -f docker/docker-compose.yml up -d
#
# Spring Boot라면: Testcontainers나 spring-boot-docker-compose 모듈이 이 파일을
# 애플리케이션 기동에 맞춰 자동으로 띄워 주지만, 여기서는 수동으로 올린다.

name: hl7poc

services:

  # ─────────────────────────────────────────────────────────────
  # ActiveMQ Classic 5.18 — javax.jms 네임스페이스를 쓰는 마지막 계열.
  # 5.19+ 는 jakarta.jms 로 넘어가므로 레거시 재현 목적상 5.18 로 고정한다.
  # ─────────────────────────────────────────────────────────────
  activemq:
    image: apache/activemq-classic:5.18.3
    container_name: hl7poc-activemq
    ports:
      - "61616:61616"   # OpenWire (애플리케이션 접속)
      - "8161:8161"     # 웹 콘솔 http://localhost:8161/admin (admin/admin)
    volumes:
      - ./activemq/activemq.xml:/opt/apache-activemq/conf/activemq.xml:ro
      - activemq-data:/opt/apache-activemq/data
    healthcheck:
      # 브로커 프로세스가 아니라 OpenWire 포트가 실제로 accept 하는지 확인한다.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/61616' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ─────────────────────────────────────────────────────────────
  # PostgreSQL 15 — initdb 스크립트로 스키마를 자동 생성한다.
  # (initdb 는 데이터 볼륨이 비어 있을 때만 실행된다. 스키마를 고쳤다면
  #  docker compose down -v 로 볼륨을 지우고 다시 올려야 한다.)
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: hl7poc-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hl7poc}
      POSTGRES_USER: ${POSTGRES_USER:-hl7poc}
      # 비밀번호는 .env 로 주입한다. 기본값은 로컬 전용이며 절대 운영에 쓰지 않는다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hl7poc-local-only}
      TZ: Asia/Seoul
    volumes:
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hl7poc} -d ${POSTGRES_DB:-hl7poc}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  activemq-data:
  postgres-data:
